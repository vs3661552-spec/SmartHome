<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHome - Controle de Iluminação</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>SmartHome</h1>

        <p class="subtitle">Controle inteligente de iluminação</p>

        <!-- TELA DE LOGIN -->
        <section class="card" id="telaLogin">

            <h2>Acesse sua conta</h2>

            <p class="descricao">
                Entre para controlar sua iluminação.
            </p>

            <form id="formLogin">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" id="botaoLogin">
                    ENTRAR
                </button>

            </form>

            <p id="mensagemLogin"></p>

        </section>


        <!-- TELA DE CONTROLE DAS LÂMPADAS -->
        <section class="card" id="telaControle" hidden>

            <div class="lampadaItem" data-lampada="lampada1">

                <div class="lampada">💡</div>

                <h2>Lâmpada 1</h2>

                <p class="status">Conectando...</p>

                <button class="botaoLampada">
                    LIGAR LÂMPADA 1
                </button>

            </div>

            <div class="lampadaItem" data-lampada="lampada2">

                <div class="lampada">💡</div>

                <h2>Lâmpada 2</h2>

                <p class="status">Conectando...</p>

                <button class="botaoLampada">
                    LIGAR LÂMPADA 2
                </button>

            </div>

            <button id="botaoSair" class="botaoSair">
                SAIR DA CONTA
            </button>

        </section>

        <p class="conexao">
            Sistema de controle residencial
        </p>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
